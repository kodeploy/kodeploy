# 모니터링: VictoriaMetrics + Grafana (클러스터 안, worker2 고정)
# ----------------------------------------------------------------------------
# 매니페스트는 deploy/k8s/monitoring/{victoriametrics,grafana}.yaml. 이 플레이북은
# 그 둘을 적용하고, 레포에 둘 수 없는 것(DB 암호 Secret)과 레포 디렉토리에서
# 만들어지는 것(대시보드 ConfigMap)을 맞춘다. vmagent·kube-state-metrics는 따로 적용한다.
#
# 2026-07~11에는 managed 노드에서 systemd로 돌았다. managed를 없애며 클러스터로 들였다
# (배경은 victoriametrics.yaml 머리 주석).
#
# 실행 대상은 managed 그룹 = kubectl을 돌리는 호스트(지금은 master).
#   ansible-playbook playbooks/90-monitoring.yml -e grafana_mysql_password='...'
# 암호를 안 주면 기존 Secret을 그대로 둔다(처음이라 Secret이 없으면 DB 패널만 비고 Grafana는 뜬다).
#
# ⚠️ 사전 준비 — Grafana 읽기 전용 DB 계정. 1회성 운영 데이터라 코드에 안 박고 DB에서 직접:
#     kubectl exec -n default sts/mysql -- mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
#       CREATE USER IF NOT EXISTS 'grafana'@'%' IDENTIFIED BY '<암호>';
#       GRANT SELECT ON kodeploy.build_records TO 'grafana'@'%';
#       FLUSH PRIVILEGES;"
#   build_records 한 테이블만 준다 — users·sessions·builds(로그·진단 전문)는 안 준다.
#   빌드·AI 진단 계측은 저빈도 이벤트라 시계열(rate)로는 안 잡히고, "어떤 빌드가 왜"가
#   튜닝 재료라 라벨로 못 넣는다 — 그래서 시계열과 별도로 DB 데이터소스를 둔다.
- hosts: managed
  become: false
  vars:
    manifest_dir: "{{ playbook_dir }}/../../deploy/k8s/monitoring"
    dashboard_files: "{{ query('fileglob', playbook_dir + '/../../deploy/grafana/dashboards/*.json') | sort }}"
    grafana_mysql_password: ""            # -e grafana_mysql_password='...' 로 주입
  tasks:
    # StatefulSet은 내용이 같아도 apply가 늘 "configured"를 낸다 — volumeClaimTemplates가
    # 통째 교체되는 목록이라 API 서버가 채운 volumeMode·status 때문에 매번 달라 보인다
    # (generation은 안 바뀜). 그래서 diff로 실제 변경이 있을 때만 apply한다.
    - name: VictoriaMetrics 변경 확인
      command: kubectl diff -f -
      args:
        stdin: "{{ lookup('file', manifest_dir + '/victoriametrics.yaml') }}"
      register: vm_diff
      changed_when: false
      failed_when: vm_diff.rc > 1          # 0=같음, 1=다름, 그 이상=오류

    - name: VictoriaMetrics 적용
      when: vm_diff.rc == 1
      command: kubectl apply -f -
      args:
        stdin: "{{ lookup('file', manifest_dir + '/victoriametrics.yaml') }}"

    - name: Grafana DB 암호 Secret
      when: grafana_mysql_password | length > 0
      command: kubectl apply -f -
      args:
        stdin: "{{ secret | to_json }}"
      vars:
        secret:
          apiVersion: v1
          kind: Secret
          metadata: { name: grafana-db, namespace: monitoring }
          type: Opaque
          stringData: { password: "{{ grafana_mysql_password }}" }
      register: secret_apply
      changed_when: "' configured' in secret_apply.stdout or ' created' in secret_apply.stdout"
      no_log: true                        # 암호가 로그로 찍히지 않게

    # 대시보드 JSON은 레포가 진실원 — 디렉토리 통째로 ConfigMap 하나를 만든다.
    # apply가 data를 통째로 맞추므로 레포에서 지운 대시보드는 ConfigMap에서도 빠지고,
    # file provider가 다음 스캔에 Grafana에서도 지운다.
    - name: 대시보드 ConfigMap
      command: kubectl apply -f -
      args:
        stdin: "{{ cm | to_json }}"
      vars:
        cm:
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: grafana-dashboards, namespace: monitoring }
          data: "{{ dict(dashboard_files | map('basename') | zip(query('file', *dashboard_files))) }}"
      register: cm_apply
      changed_when: "' configured' in cm_apply.stdout or ' created' in cm_apply.stdout"

    - name: Grafana 적용
      command: kubectl apply -f -
      args:
        stdin: "{{ lookup('file', manifest_dir + '/grafana.yaml') }}"
      register: grafana_apply
      changed_when: "' configured' in grafana_apply.stdout or ' created' in grafana_apply.stdout"

    # 데이터소스·프로바이더는 subPath 마운트라 ConfigMap이 바뀌어도 Pod에 안 들어가고,
    # Grafana도 기동 시에만 읽는다 → 바뀌면 재시작. 대시보드 ConfigMap은 일반 마운트라
    # kubelet이 갱신하고 file provider가 다시 읽으므로 재시작 대상이 아니다.
    - name: Grafana 재시작 (프로비저닝·암호 변경 시)
      when: >-
        'grafana-provisioning configured' in grafana_apply.stdout
        or (secret_apply is changed)
      command: kubectl rollout restart deploy/grafana -n monitoring

    - name: 롤아웃 대기
      command: kubectl rollout status {{ item }} -n monitoring --timeout=300s
      loop:
        - sts/victoriametrics
        - deploy/grafana
      changed_when: false
