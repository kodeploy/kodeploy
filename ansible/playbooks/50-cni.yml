---
# Calico 설치와 업그레이드를 같은 순서로 한다(server-side apply라 이미 있어도 그대로 덮는다).
# 2026-11-14 운영을 v3.27.0 → v3.32.4로 올렸다. 3.27.0의 calico-apiserver는 메모리 누수가 있었다(하루 약 330MB).
# 원인은 etcd 상태 점검의 otelgrpc 계측이 OTel 전역 meter에 계속 쌓이는 버그이고, OTel v1.30 이상(Calico 3.30 이상)에서 고쳐졌다.
# 3.32의 바뀐 점: CRD가 tigera-operator.yaml에서 빠져 별도 파일이 됐고, 기본 레지스트리가 quay.io로 바뀌었다(arm64 있음).
# calico-apiserver는 calico-system 네임스페이스로 옮겨 갔다. 업그레이드 뒤에는 projectcalico.org/v3 UID가 바뀌므로
# Argo 애플리케이션 컨트롤러를 재시작하고 앱을 hard refresh한다.
- name: Install or upgrade Calico CNI
  hosts: master
  become: true
  vars:
    calico_version: v3.32.4
    pod_cidr: 192.168.0.0/16
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Calico CRD 적용 (crd.projectcalico.org, operator.tigera.io)
      command: >-
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/v1_crd_projectcalico_org.yaml

    - name: Tigera operator 적용
      command: >-
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml

    - name: Calico Installation CR 생성 (IPIP Always for OCI)
      copy:
        dest: /tmp/calico-installation.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            # controlPlaneReplicas는 기본값(2)을 쓴다. calico-apiserver가 한 개뿐이면, 그게 재시작하는 동안
            # Argo가 projectcalico.org 스키마를 잃고 Unknown에 빠진다(2026-11-14 두 번 겪음).
            calicoNetwork:
              # 3.32는 kube-proxy 설정을 보고 nftables/iptables를 고른다. 운영은 iptables(kube-proxy mode "")라 명시해 둔다
              linuxDataplane: Iptables
              # operator가 채우는 기본값까지 운영과 똑같이 적는다. apply는 이 목록을 통째로 바꾸므로,
              # 빠진 필드가 있으면 다시 돌릴 때 IP 풀 정의가 흔들린다(kubectl diff로 빈 차이 확인)
              ipPools:
                - name: default-ipv4-ippool
                  blockSize: 26
                  cidr: {{ pod_cidr }}
                  encapsulation: IPIP
                  natOutgoing: Enabled
                  nodeSelector: all()
                  allowedUses: [Workload, Tunnel]
                  assignmentMode: Automatic
                  disableBGPExport: false
                  disableNewAllocations: false
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}
        mode: '0644'

    - name: Calico Installation CR apply
      command: kubectl apply -f /tmp/calico-installation.yaml

    - name: Calico 구성요소가 Available이 될 때까지 대기
      command: kubectl wait --for=condition=Available tigerastatus/calico tigerastatus/apiserver --timeout=600s
