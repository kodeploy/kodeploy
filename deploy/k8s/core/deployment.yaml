apiVersion: apps/v1
kind: Deployment                                         # Pod을 정해진 수만큼 유지하는 컨트롤러
metadata:
  name: kodeploy-core
  namespace: default
  labels:
    app: kodeploy-core
spec:
  replicas: 1                                            # Pod 복제본 수
  selector:
    matchLabels:
      app: kodeploy-core                                 # 이 라벨 가진 Pod을 "내 Pod"으로 인식
  template:
    metadata:
      labels:
        app: kodeploy-core                               # selector와 반드시 매칭
    spec:
      serviceAccountName: kodeploy-core                  # in-cluster K8s API 호출용 SA (rbac.yaml)
      containers:
        - name: core
          # ⚠️ 이 줄은 CI(.github/workflows/build-core.yml)가 커밋 SHA 태그 + digest로 자동 고정한다.
          #    아래 형식으로만 유지할 것 — 워크플로가 줄 끝까지 통째로 교체하므로 뒤에 주석을 달면 지워진다.
          #      image: ghcr.io/<owner>/kodeploy-core:sha-<short>@sha256:<digest>
          #    :latest로 되돌리지 말 것. 태그가 움직이면 (1) 되돌릴 지점이 사라지고,
          #    (2) 모든 revision의 image 문자열이 같아져 kubectl rollout undo가 무의미해지며,
          #    (3) 기본 pull 정책 Always와 겹쳐 Pod이 재생성될 때마다 배포한 적 없는 버전이 조용히 올라온다.
          image: ghcr.io/yuntyu01/kodeploy-core:sha-bd22c05@sha256:98fd2adaffbb9a8aded3972f6e7a3c4bfc28b3f555fe2b13d313a241a4a29fac
          # digest로 고정되면 같은 참조 = 같은 바이트라 재pull이 무의미하다. 노드 캐시를 그대로 쓴다.
          # (고정 전 :latest 상태에서도 Always보다 안전한 쪽 — 조용한 버전 교체가 일어나지 않는다.)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000                        # 컨테이너 내부 listen 포트 (문서화용)
          resources:
            requests:                                    # 스케줄러 보장값 — 가벼운 FastAPI 백엔드
              cpu: 100m                                  # 0.1 vCPU
              memory: 256Mi
              ephemeral-storage: 256Mi                   # 스냅샷 stage용 /tmp 보장값
            limits:                                      # 런타임 상한 (초과 시 throttle / OOMKill)
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 2Gi                     # 초과 시 core evict — 거대 덤프가 노드 디스크 잠식 방지(최후 안전판)
          envFrom:
            - configMapRef:
                name: kodeploy-core-env                  # 환경변수 묶음 일괄 주입
            - secretRef:
                name: kodeploy-oauth                     # GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
                optional: true                           # 없으면 /auth/github/login만 500 — /healthz는 살아있게
            - secretRef:
                name: kodeploy-cloudflare                # CF_API_TOKEN (R2 버킷/토큰 프로비저닝)
                optional: true                           # 없으면 storage 토글만 비활성 — 나머지는 정상
            - secretRef:
                name: kodeploy-origin-verify             # ORIGIN_VERIFY_SECRET — 앱 HTTPRoute 헤더매칭값(origin-lock B′)
                optional: true                           # 없으면 새 앱 라우트에 헤더매칭 미주입(Layer A만) — /healthz 정상
            - secretRef:
                name: kodeploy-ai                        # LLM_API_KEY — 빌드/배포 실패 AI 진단
                optional: true                           # 없으면 진단만 비활성 — 빌드·배포는 그대로
          env:
            - name: DB_PASSWORD                          # 시크릿은 개별로
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          startupProbe:                                  # 부팅 단계 전용. 통과 전엔 liveness/readiness 멈춤
            httpGet:
              path: /healthz                             # main.py의 /healthz 엔드포인트
              port: 8000
            failureThreshold: 12                         # 실패 N회까지 허용
            periodSeconds: 5                             # N초마다 체크 → 최대 60초까지 부팅 허용
          livenessProbe:                                 # 프로세스 살아있나 — 실패 시 재시작
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10                            # N초마다 체크
            failureThreshold: 3                          # 연속 N회 실패 시 재시작 (30초)
          readinessProbe:                                # 트래픽 받을 준비 됐나 — 실패 시 endpoint에서만 제외
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 3                          # 연속 N회 실패 시 endpoint 제외 (15초)
      imagePullSecrets:
        - name: ghcr-auth                                # private GHCR 이미지 pull용 인증
