apiVersion: v1
kind: ServiceAccount                                     # Pod에 붙는 K8s 내부 신원 (토큰 자동 mount)
metadata:
  name: kodeploy-core
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole                                        # 클러스터 전역 권한 — 테넌트 ns 밖에서도 필요한 것만
metadata:
  name: kodeploy-core
# 원칙: core가 app/ 코드에서 "실제로 호출하는" 동사만 둔다 (2026-10 전수 대조).
# 워크로드(Deployment·DB·Service·HTTPRoute·NetworkPolicy)는 차트가 그리고 Argo가 apply한다 — core는 쓰지 않는다.
# 권한은 세 덩어리다:
#   1. 여기(전역): ns 만들기, 테넌트 ns에 자기 RoleBinding 걸기, 노드 조회
#   2. kodeploy-core-tenant: 테넌트 ns 안의 Secret·PVC·Pod 로그와 그 ns 자신의 삭제 — 그 ns의 RoleBinding으로만 받는다
#      (core가 ns를 만들 때 같이 건다 — manifests/templates/tenant.yaml.j2). argocd·kube-system엔 닿지 않는다.
#   3. kodeploy-build의 Role: 빌드 Secret(ghcr-auth 읽기, git-auth)·Job/Pod 조회(진단)
# 전역의 ns 생성과 RoleBinding 생성은 이름·모양을 admission 정책이 묶는다 (admission-policy.yaml) —
# RBAC만으로는 "app-·tenant- ns만"을 표현할 수 없어서다.
# ns 읽기는 아예 없다 — 지운 직후 재배포의 Terminating 대기는 RoleBinding 생성 거절(NamespaceTerminating)로 판정한다.
# watch는 어디서도 안 쓴다 — 상태 추적은 전부 폴링이라 의도적으로 뺐다.
# ⚠️ 새 K8s 호출을 추가하고 여기를 안 늘리면 대부분 403으로 터지지만, 항상 그렇진 않다:
#    admin/service.py, console/logs.py 등은 예외를 삼켜서 "빈 목록/빈 로그"로 위장한다.
#    권한을 줄인 뒤 검증할 땐 화면이 뜨는지가 아니라 실제 내용(로그 줄·Pod 행)이 나오는지로 판정할 것.
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]                                    # 테넌트 이름만 (admission). 삭제는 kodeploy-core-tenant 쪽
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]                                    # 테넌트 ns에 kodeploy-core-tenant를 자기에게 거는 것만 (admission)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["kodeploy-core-tenant"]
    verbs: ["bind"]                                      # RoleBinding으로 걸 수 있는 ClusterRole은 이것 하나
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]                                      # 관리자 노드 현황의 노드별 Pod limit 합산 (전 ns, 읽기만)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]                                       # kubelet /stats/summary 직접 조회 (nodes/proxy는 kubelet exec까지 열려 쓰지 않는다)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding                                 # SA를 ClusterRole에 연결
metadata:
  name: kodeploy-core
subjects:
  - kind: ServiceAccount
    name: kodeploy-core
    namespace: default
roleRef:
  kind: ClusterRole                                      # 어떤 권한을 (위에서 정의한 ClusterRole)
  name: kodeploy-core
  apiGroup: rbac.authorization.k8s.io                    # RBAC v1 그룹 (빠뜨리면 validation 에러)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole                                        # 테넌트 ns 안의 권한 묶음 — ClusterRoleBinding 없이 ns별 RoleBinding으로만 쓴다
metadata:
  name: kodeploy-core-tenant
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["delete"]                                    # 앱 삭제. ns 안 RoleBinding이 주는 namespaces 권한은 그 ns 객체 하나에만 닿는다
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]         # 환경변수·의존성 비밀번호·R2·ghcr-auth. list 없음 — 이름을 알고 여는 것만
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]                                    # 로컬 볼륨. 삭제는 ns delete가 대신함
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]                                      # 라벨 셀렉터로 Pod 찾기 (상태·로그·DB 종류·exec Pod Ready·배포 뒤 감시)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # pods/exec는 없다 — 터미널·DB 콘솔·덤프·복원은 테넌트별 kodeploy-exec가 한다(2026-11, kodeploy-charts templates/exec.yaml).
  # 비상으로 되살릴 땐 get·create 둘 다 준다: connecter 서브리소스는 can-i가 get을 yes라 해도 실제 업그레이드는
  # get만으로 403이었다(실측). 되돌리는 절차는 hack/exec-e2e.md "되돌리기".
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role                                               # 빌드 ns (빌드 Job은 빌더가 만든다)
metadata:
  name: kodeploy-core
  namespace: kodeploy-build
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-auth"]
    verbs: ["get"]                                       # ghcr-auth를 읽어 테넌트로 복사 — 이 ns의 다른 Secret은 읽지 못한다
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "delete"]                # 비공개 저장소 git-auth-<build_id> (이름이 빌드마다 달라 resourceNames로 못 묶는다)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]                                      # 실패 진단이 종료 사유를 읽는다 (diagnose.py)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]                                      # 같은 진단 — 빌드 Pod 컨테이너 종료 정보
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kodeploy-core
  namespace: kodeploy-build
subjects:
  - kind: ServiceAccount
    name: kodeploy-core
    namespace: default
roleRef:
  kind: Role
  name: kodeploy-core
  apiGroup: rbac.authorization.k8s.io
