# 빌더 권한 - 클러스터 전체에 걸리는 바인딩은 없다.
#   kodeploy-build: 빌드 Job 생성·Watch·어노테이션·삭제, 빌드 Pod 로그
#   argocd:         Application refresh 어노테이션·상태 조회
#   앱 네임스페이스: Pod·로그 읽기만 (배포 뒤 크래시 감지와 실패 로그). ClusterRole은 여기서 정의만 하고,
#                   바인딩은 kodeploy-charts가 Argo 관리 앱의 네임스페이스마다 RoleBinding으로 그린다.
# Secret·exec·쓰기 권한은 테넌트 네임스페이스에 없다 (배포는 kodeploy-apps 커밋 → Argo가 한다).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kodeploy-builder
  namespace: kodeploy-build
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]   # patch = 진행 상태 어노테이션, list = 재개
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]                                # build-id 라벨로 빌드 Pod 찾기·컨테이너 상태
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]                                                 # follow 스트림
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kodeploy-builder
  namespace: kodeploy-build
subjects:
  - kind: ServiceAccount
    name: kodeploy-builder
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kodeploy-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kodeploy-builder
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]                       # patch = argocd.argoproj.io/refresh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kodeploy-builder
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: kodeploy-builder
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kodeploy-builder
---
# 바인딩 없음. kodeploy-charts templates/builder-rolebinding.yaml이 앱 네임스페이스마다 묶는다.
# 이름을 바꾸면 차트 platform/cluster.yaml의 builder.appReaderRole도 같이 바꾼다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kodeploy-builder-app-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]                                         # 앱 컨테이너 재시작 수·대기 사유, 의존성 Ready
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]                                                 # 실패 때 앱 로그 끝 80줄
