# 플랫폼 DB(core MySQL) 백업 — mysqldump → gzip → R2.
# ----------------------------------------------------------------------------
# 왜 필요한가: etcd 백업(36-etcd-backup.yml)은 클러스터 상태만 덮는다. 유저·앱·배포 선언은
# 전부 이 MySQL에만 있어서, 여기가 날아가면 클러스터는 살아 있는데 플랫폼이 자기 상태를 모른다.
# 게다가 이 DB는 manual StorageClass + local PV(/opt/mysql-data @ worker1)라 노드 1대에 묶여 있다
# (deploy/k8s/mysql/pv.yaml). 즉 worker1 소실 = 플랫폼 소실 — 오프사이트 사본이 유일한 방어다.
#
# 구조는 빌드 Job과 같은 init/main 분리:
#   init(dump)  = mysql:8.4 — mysqldump + 무결성 검증. 검증 실패면 여기서 죽어 업로드 안 함.
#   main(upload)= rclone   — R2 업로드 + 원격 해시 대조 + 보존기간 회전.
# 한 이미지에 mysqldump와 rclone이 같이 없어서 나눈 것이고, emptyDir로 파일을 넘긴다.
#
# ⚠️ 덤프에는 세션 토큰(sessions.id)과 유저 이메일이 그대로 들어간다. etcd 스냅샷과 같은
#    민감도다 — 반드시 비공개 버킷 + 그 버킷에만 스코프된 전용 토큰에만 올릴 것.
#    유저 앱용 R2 토큰(r2.py가 발급하는 것)을 재사용하지 말 것: 신뢰 경계가 다르다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kodeploy-db-backup-script
  namespace: default
data:
  # --- dump 단계 -------------------------------------------------------------
  # 검증은 exit code만 믿지 않고 덤프 "본문"의 sentinel로 판정한다. mysqldump는 연결이
  # 중간에 끊겨도 그때까지 쓴 내용으로 0을 반환할 수 있어서, exit 0 + 잘린 덤프가 조용히
  # 올라가는 게 백업의 대표적 가짜 합격이다. 그래서 두 가지를 본문에서 확인한다:
  #   1) 마지막 줄의 "-- Dump completed" — mysqldump가 끝까지 갔다는 증거
  #   2) 기대 테이블 6개의 CREATE TABLE — 부분 덤프가 아니라는 증거
  dump.sh: |
    #!/bin/bash
    set -euo pipefail

    TS=$(date -u +%Y%m%d-%H%M%S)
    OUT="/backup/kodeploy-${TS}.sql.gz"
    # 스키마가 늘면 여기에 추가 — 누락 감지의 기준선이다 (core/app/**/model.py의 __tablename__)
    EXPECTED="users sessions builds build_records posts comments saved_queries apps tiers"

    echo "[1/3] mysqldump ${DB_NAME} @ ${DB_HOST} ..."
    # --single-transaction : InnoDB 일관 스냅샷을 락 없이 (운영 중 백업이라 필수)
    # --databases          : CREATE DATABASE/USE를 포함시켜 빈 인스턴스로도 복원 가능하게
    #                        (복원 리허설 restore-drill.yaml이 이걸 전제로 동작)
    # --no-tablespaces     : PROCESS 권한 요구 회피 — 권한 축소해도 안 깨지게
    MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqldump \
      -h "${DB_HOST}" -P 3306 -u root \
      --single-transaction --routines --triggers --no-tablespaces \
      --databases "${DB_NAME}" \
      | gzip -c > "${OUT}"

    echo "[2/3] 무결성 검증 (본문 sentinel) ..."
    # gzip 스트림 자체가 온전한지 + 마지막 줄 sentinel
    if ! gzip -dc "${OUT}" | tail -3 | grep -q 'Dump completed'; then
      echo "  ✗ 'Dump completed' 없음 — 덤프가 중간에 잘렸다. 업로드 중단."
      exit 1
    fi
    # 기대 테이블이 전부 들어있는지 (부분 덤프 감지)
    FOUND=$(gzip -dc "${OUT}" | grep -o 'CREATE TABLE `[^`]*`' | sed 's/.*`\(.*\)`/\1/' | sort -u)
    for t in ${EXPECTED}; do
      if ! echo "${FOUND}" | grep -qx "${t}"; then
        echo "  ✗ 테이블 누락: ${t}"
        echo "    덤프에 있는 테이블: $(echo ${FOUND} | tr '\n' ' ')"
        exit 1
      fi
    done

    echo "[3/3] ok: ${OUT} ($(du -h "${OUT}" | cut -f1)), 테이블 $(echo "${FOUND}" | wc -l)개"

  # --- upload 단계 -----------------------------------------------------------
  # rclone copy는 업로드 후 해시를 대조하지만, 그것과 별개로 check를 한 번 더 돌려
  # "원격에 실제로 그 바이트가 있다"를 확인한다 (copy가 no-op으로 넘어간 경우까지 잡힘).
  upload.sh: |
    #!/bin/bash
    set -euo pipefail

    : "${BACKUP_REMOTE:?BACKUP_REMOTE 미설정}"   # 예: r2:kodeploy-platform-backup/mysql
    KEEP_DAYS="${KEEP_DAYS:-30}"

    echo "[1/3] 업로드 → ${BACKUP_REMOTE}"
    rclone copy /backup "${BACKUP_REMOTE}" --no-traverse

    echo "[2/3] 원격 대조 (해시)"
    # --one-way: 로컬에 있는 파일이 원격에 같은 내용으로 있는지만 본다 (원격의 과거 백업은 무시)
    rclone check /backup "${BACKUP_REMOTE}" --one-way

    echo "[3/3] 보존기간 회전 (${KEEP_DAYS}일 초과 삭제)"
    rclone delete "${BACKUP_REMOTE}" --min-age "${KEEP_DAYS}d"

    echo "남은 백업:"
    rclone lsf "${BACKUP_REMOTE}" | tail -5
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kodeploy-db-backup
  namespace: default
  labels:
    app: kodeploy-db-backup
spec:
  schedule: "0 18 * * *"              # UTC 18:00 = KST 03:00 (트래픽 최저 시간대)
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid           # 이전 백업이 안 끝났으면 건너뜀 — 덤프 2개가 디스크를 겹쳐 쓰지 않게
  startingDeadlineSeconds: 3600       # 노드 다운 등으로 놓친 실행은 1시간 안에만 보충
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3           # 실패 Job은 남겨야 로그로 원인을 본다
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800     # 30분 — 덤프+업로드가 이보다 오래 걸리면 이상 상황
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: kodeploy-db-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999            # mysql 이미지의 mysql user
            runAsGroup: 999
            fsGroup: 999              # emptyDir를 init/main이 함께 쓰도록 ownership 부여
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: mysql:8.4        # core mysql과 동일 태그 — 클라이언트/서버 버전 불일치 회피
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/bash", "/script/dump.sh"]
              env:
                - name: DB_HOST
                  value: mysql        # default ns headless Service
                - name: DB_NAME
                  value: kodeploy
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: MYSQL_ROOT_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 3Gi   # 노드 root가 ~29Gi뿐이라 상한 필수 — 초과 시 이 Pod만 evict
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: script
                  mountPath: /script
                  readOnly: true
          containers:
            - name: upload
              image: rclone/rclone:1.68    # ARM64 지원. R2는 S3 호환이라 provider=Cloudflare로 붙는다
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "/script/upload.sh"]
              env:
                - name: HOME
                  value: /tmp               # rclone이 config 파일을 찾는 경로 — env 설정만 쓰므로 쓰기 가능한 곳이면 됨
              envFrom:
                - secretRef:
                    name: kodeploy-backup-r2   # RCLONE_CONFIG_R2_* + BACKUP_REMOTE (아래 주석 참고)
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
                  ephemeral-storage: 3Gi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 3Gi              # Pod 종료 시 자동 GC — 덤프는 노드에 남지 않는다
            - name: script
              configMap:
                name: kodeploy-db-backup-script
                defaultMode: 0555
