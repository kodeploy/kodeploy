# Argo CD core 설치본 (application-controller, applicationset-controller, repo-server, redis).
# UI·API 서버(argocd-server), dex, notifications가 없는 설치본을 일부러 쓴다. 외부 노출 없음.
# 적용: ansible/playbooks/75-argocd.yml (CRD가 커서 kubectl apply --server-side -k)
#
# 원본에는 resources가 비어 있어서 네 컴포넌트 모두 채운다. CPU 상한은 두지 않는다.
# 네 컴포넌트 모두 worker2를 선호한다 (preferred, 강제 아님). worker1은 디스크 80%라 피한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/core-install.yaml

patches:
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: kubernetes.io/hostname, operator: In, values: [worker2] }
            containers:
              - name: argocd-application-controller
                resources:
                  requests: { cpu: 50m, memory: 256Mi }
                  limits: { memory: 1Gi }

  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: kubernetes.io/hostname, operator: In, values: [worker2] }
            containers:
              - name: argocd-repo-server
                resources:
                  requests: { cpu: 50m, memory: 128Mi }
                  limits: { memory: 512Mi }

  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: kubernetes.io/hostname, operator: In, values: [worker2] }
            containers:
              - name: argocd-applicationset-controller
                resources:
                  requests: { cpu: 25m, memory: 64Mi }
                  limits: { memory: 256Mi }

  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: kubernetes.io/hostname, operator: In, values: [worker2] }
            containers:
              - name: redis
                resources:
                  requests: { cpu: 25m, memory: 32Mi }
                  limits: { memory: 128Mi }
