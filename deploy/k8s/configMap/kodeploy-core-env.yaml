apiVersion: v1
kind: ConfigMap                                          # 비밀이 아닌 환경변수/설정 묶음 (Secret과 분리)
metadata:
  name: kodeploy-core-env
data:
  GHCR_USER: "yuntyu01"                                  # GHCR 이미지 푸시/풀 시 owner 경로
  CF_ACCOUNT_ID: "4a73c7440c6c59e668d89d6f06c4813e"                                      # Cloudflare 계정 ID (R2 endpoint·API 경로 파생). 대시보드 사이드바에서 복사해 채우기
  CF_ZONE_ID: "2fec3004cefff9a5e7fef294f4312816"                                          # kodeploy.com zone ID — 커스텀 도메인(CF for SaaS custom hostname) zone-scoped API용
  DB_HOST: "mysql"                                       # 운영 mysql Service 이름 (DNS로 접근)
  DB_USER: "kodeploy"
  DB_NAME: "kodeploy"
  ALLOWED_ORIGINS: "https://app.kodeploy.com,https://kodeploy.pages.dev,http://localhost:5173,http://127.0.0.1:5173"
  GITHUB_OAUTH_REDIRECT_URI: "https://api.kodeploy.com/auth/github/callback"
  GITHUB_APP_ID: "3794809"                               # GitHub App 숫자 ID — installation token JWT 서명(iss)용. 공개값
  GITHUB_APP_SLUG: "kodeploy"                             # App 슬러그(github.com/apps/kodeploy) — private repo 연결 설치 페이지 링크용
  WEB_BASE_URL: "https://app.kodeploy.com"
  # app.kodeploy.com ↔ api.kodeploy.com = same-site → Lax + Domain 공유
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: "lax"
  SESSION_COOKIE_DOMAIN: ".kodeploy.com"
  # early-trigger — 이미지 push 마커("pushing manifest ... done")를 보면 Job 완료를 안 기다리고
  # 곧장 배포로 넘어간다. 이미지는 이미 레지스트리에 있으니 배포는 유효하고, 남은 cache export는
  # 뒤에서 돌다가 배포 판정 후 회수된다. 마커를 못 잡으면 Job 완료를 기다리는 기존 경로로 자동 폴백
  # (느려질 뿐 안 깨짐). export가 실패해도 build.status는 안 건드리고 cache_export_failed 지표로만 남는다.
  # 전후 비교는 Grafana '시스템' 대시보드의 early-trigger A/B 표(triggered_early 축)에서 본다.
  EARLY_TRIGGER: "true"
  # 빌드/배포 실패 AI 진단. kodeploy-ai Secret(LLM_API_KEY)이 함께 있어야 한다.
  # 켜기 전 check_diagnose.py를 core Pod 안에서 돌려 계측기를 먼저 검증했다
  # (게이트웨이 strict json_schema 통과 · 정답 케이스 2/2 · 토큰/레이턴시 수집 확인).
  # 호출당 비용·품질은 Grafana '시스템' 대시보드의 AI 진단 섹션에서 본다.
  AI_DIAGNOSE: "true"
  # 사내 API Gateway (OpenAI 호환 엔드포인트). 시크릿 아님 — 키만 Secret으로 간다.
  LLM_BASE_URL: "https://factchat-cloud.mindlogic.ai/v1/gateway"
  # 게이트웨이가 제공자를 흡수하므로 이 문자열만 바꾸면 Claude↔GPT 전환. 코드 분기 없음.
  # 바꾼 뒤엔 실패 1건으로 구조화 출력(strict json_schema) 통과 여부를 확인할 것.
  # 2026-09: 게이트웨이에서 claude-sonnet-4-6이 빠져(404 model not found) 교체.
  #   claude-sonnet-5로 check_diagnose 2/2 · 골든셋 12/12를 확인한 뒤, 게이트웨이 크레딧 단가
  #   (1K 토큰당 입력/출력: sonnet-5 2/10 → terra 2/12)를 보고 OpenAI 쪽으로 옮겼다.
  #   ⚠️ terra 자체의 구조화 출력·품질은 월 크레딧 소진(402)으로 아직 못 쟀다 — 크레딧이 초기화되면
  #      check_diagnose → golden_set 순으로 먼저 돌릴 것. 대시보드 '모델별 비용 · 품질'에서도 보인다.
  LLM_MODEL: "gpt-5.6-terra"
  # 일일 토큰 예산(입력+출력). 넘으면 그 빌드의 진단을 건너뛰고 llm_outcome="budget_exceeded"로 남긴다.
  # 근거: 골든셋 12건 실측이 호출당 입력 ~6.5k + 출력 ~0.35k 토큰(sonnet-4-6, 옛 형식).
  #       2026-09 새 진단 형식(명령어·대안·제목) + sonnet-5는 호출당 입력 ~9.1k + 출력 ~1.1k.
  #       (GPT-5.x는 추론 토큰이 출력으로 잡혀 출력이 더 클 수 있다 — terra 실측 후 다시 볼 것.)
  #       200k/일 ≈ 하루 ~20건. 개인 운영 규모에서 하루 20건 넘게 실패하면 그 자체가 이상 신호다.
  # 0으로 두면 무제한 — 예전 동작. 크레딧 소진으로 전 진단이 조용히 api_error가 된 적이 있어 상한을 둔다.
  LLM_DAILY_TOKEN_BUDGET: "200000"
