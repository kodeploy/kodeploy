name: Modo read-only infrastructure audit

on:
  push:
    branches: [codex/modo-infra-audit]
    paths:
      - scripts/modo-cloudflare-audit.py
      - .github/workflows/modo-infra-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read allowlisted metadata only
        run: python3 scripts/modo-cloudflare-audit.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
